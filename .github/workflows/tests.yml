name: CPU tests and packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
      - name: Install CPU dependencies and build package
        run: |
          python -m pip install --upgrade pip build
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt
          python -m pip install pyarrow==26.0.0
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run protocol and session tests
        run: python -m unittest discover -s tests -v
      - name: Check every source entrypoint
        run: |
          for entrypoint in scripts/*.py; do
            python "$entrypoint" --help > /dev/null
          done
      - name: Check installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import clip, clip_officehome; from clip_officehome.protocol import load_config; assert load_config("pacs")["data"]["num_scored_images"] == 9991; assert load_config("officehome")["data"]["num_scored_images"] == 15588'
          mt-tta-evaluate --help > /dev/null
          mt-tta-evaluate-imagenet --help > /dev/null
